[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cache_register" # The name people will pip install
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
django = [
    "django>=4.2.27",
]

[tool.maturin]
# This tells Maturin your python source is at the root (finding 'cache_register/')
python-source = "."

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.14.10",
]
